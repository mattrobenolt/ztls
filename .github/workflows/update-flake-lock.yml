name: update-flake-lock

on:
  workflow_dispatch:
  schedule:
    # Weekly Monday 05:23 UTC. Real lockfile evidence, not PR smoke.
    - cron: "23 5 * * 1"

permissions:
  contents: read

jobs:
  lockfile:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@d0c908e6cbe9f89f36ed8205a3ab6f092636916a # v3.23.1
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
      - uses: DeterminateSystems/update-flake-lock@da03c0f078bc4b2c37ee4f7e072d34bf8f188bb3 # v29
        with:
          pr-title: "flake.lock: update nix inputs"
          pr-labels: |
            dependencies
            automated
          # GITHUB_TOKEN opens the PR but does not trigger CI on it. A PAT
          # (repo scope, or fine-grained Contents + Pull-Requests read/write)
          # stored as GH_TOKEN_FOR_UPDATES makes the PR run CI like a human's.
          token: ${{ secrets.GH_TOKEN_FOR_UPDATES }}
